<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartMove Transport</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        /* Navigation Bar CSS */
        .navbar {
            background-color: #2c3e50;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 17px;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Form Container CSS */
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        input[type=text], input[type=email], input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #2ecc71;
        }

        /* New CSS for Data Display Table */
        .data-container {
            max-width: 600px;
            margin: 20px auto 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .success-msg {
            color: #27ae60;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
    </div>

    <!-- Registration Form -->
    <div class="container">
        <h2>Passenger Registration</h2>

        <!-- පණිවිඩය පෙන්වීම -->
        {% if success %}
            <div class="success-msg">Successfully Registered!</div>
        {% endif %}

        <form action="/register" method="post">
            <label for="name"><b>Full Name</b></label>
            <input type="text" placeholder="Enter full name" name="name" required>

            <label for="email"><b>Email</b></label>
            <input type="email" placeholder="Enter your email" name="email" required>

            <label for="psw"><b>Password</b></label>
            <input type="password" placeholder="Enter new password" name="psw" required>

            <button type="submit">Register now</button>
        </form>
    </div>

    <!-- MongoDB Data Display Section -->
    <div class="data-container">
        <h2>Registered Passengers (MongoDB)</h2>
        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>
            {% for p in passengers %}
            <tr>
                <td>{{ p.name }}</td>
                <td>{{ p.email }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2" style="text-align: center; color: #7f8c8d;">No passengers found in the database.</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
